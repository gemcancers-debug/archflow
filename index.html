<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptArch | پرامپت‌ساز حرفه‌ای هوش مصنوعی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&amp;display=swap');
        body { font-family: 'Vazirmatn', system-ui, sans-serif; }
        .prompt-box {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            line-height: 1.7;
        }
        .section-title { font-size: 1.1rem; letter-spacing: -.025em; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100">
    <header class="bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-x-4">
                <div class="w-11 h-11 bg-violet-600 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-magic text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-bold tracking-tight">PromptArch</h1>
                    <p class="text-xs text-zinc-500 -mt-1">پرامپت حرفه‌ای برای تولید محتوا</p>
                </div>
            </div>
            <div class="flex items-center gap-x-3">
                <button onclick="toggleDarkMode()" class="px-4 py-2 rounded-2xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 flex items-center gap-x-2 text-sm">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <div class="text-right">
                    <div class="text-sm font-semibold">حامد فریفته</div>
                    <div class="text-[10px] text-zinc-500">Developer</div>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-6 pt-10 pb-20">
        <div class="max-w-2xl mx-auto text-center mb-10">
            <h2 class="text-5xl font-bold tracking-tighter mb-4">موضوع بده.<br>پرامپت حرفه‌ای بگیر.</h2>
            <p class="text-xl text-zinc-600 dark:text-zinc-400">پرامپت‌های عمیق، غیرکلیشه‌ای و پرجزویه برای هوشهای مصنوعی</p>
        </div>

        <!-- Input -->
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl p-8 mb-8">
            <div class="mb-6">
                <label class="block text-sm font-medium mb-2 text-zinc-600 dark:text-zinc-400">موضوع (حداکثر ۱۰ کلمه)</label>
                <input id="topic" type="text" value="تأثیر موسیقی بر مغز انسان" 
                       class="w-full px-6 py-4 text-xl rounded-2xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-950 focus:outline-none focus:border-violet-500"
                       placeholder="مثال: تأثیر موسیقی بر مغز انسان">
            </div>

            <button onclick="generatePrompt()" 
                    class="w-full py-4 bg-violet-600 hover:bg-violet-700 transition-all text-white text-lg font-semibold rounded-3xl flex items-center justify-center gap-x-3">
                <i class="fa-solid fa-magic"></i>
                <span>تولید پرامپت حرفه‌ای</span>
            </button>
        </div>

        <!-- Output -->
        <div id="result" class="hidden">
            <div class="flex items-center justify-between mb-4 px-1">
                <div class="font-semibold text-xl">پرامپت تولید شده</div>
                <button onclick="copyPrompt()" class="flex items-center gap-x-2 px-5 py-2 text-sm rounded-2xl bg-zinc-900 dark:bg-white dark:text-zinc-900 text-white hover:bg-black transition-colors">
                    <i class="fa-solid fa-copy"></i>
                    <span>کپی پرامپت</span>
                </button>
            </div>

            <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl p-8">
                <pre id="prompt-output" class="prompt-box whitespace-pre-wrap text-sm leading-relaxed text-zinc-800 dark:text-zinc-200"></pre>
            </div>

            <div class="mt-6 text-center">
                <button onclick="generatePrompt()" class="text-sm text-violet-600 hover:text-violet-500 flex items-center gap-x-2 mx-auto">
                    <i class="fa-solid fa-redo"></i>
                    <span>تولید پرامپت جدید</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function initTailwind() {
            document.documentElement.classList.add('dark');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function generatePrompt() {
            const topic = document.getElementById('topic').value.trim();
            if (!topic) {
                alert('لطفاً موضوع را وارد کنید');
                return;
            }

            const prompt = createHighQualityPrompt(topic);
            
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('prompt-output').textContent = prompt;
            
            // Scroll to result
            document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function createHighQualityPrompt(topic) {
            return `You are an exceptionally deep, original, and intellectually rigorous thinker and writer. Your task is to write a profound, non-cliché, and intellectually stimulating article about the following topic:

"${topic}"

**Core Requirements:**

1. **Avoid all clichés and superficial content.** Do not repeat common ideas that appear in most articles on this subject. Dig deeper.

2. **Incorporate multiple intellectual traditions and perspectives:**
   - Draw from major philosophers (Western and Eastern) such as Nietzsche, Aristotle, Ibn Sina (Avicenna), Rumi, Heidegger, and others where relevant.
   - Include insights from cognitive science, neuroscience, psychology, and anthropology.
   - Reference ancient civilizations and their wisdom (Persian, Greek, Indian, Chinese, Mesopotamian, etc.) where it adds depth.
   - Explore "buried" or lesser-known knowledge from historical texts and traditions.

3. **Structure the article with intellectual depth:**
   - Start with a powerful, thought-provoking opening that challenges common assumptions.
   - Explore multiple angles and tensions (e.g., individual vs collective, ancient vs modern, rational vs intuitive).
   - Include surprising connections between seemingly unrelated fields.
   - End with genuine insight rather than generic conclusions.

4. **Tone and Style:**
   - Write in an elegant, precise, and intellectually honest voice.
   - Balance scholarly depth with accessibility.
   - Use vivid but non-sentimental language.
   - Aim for originality and intellectual courage.

5. **Research Integration:**
   - Weave in the latest relevant scientific and cognitive research (cite specific studies or findings when possible).
   - Contrast modern scientific understanding with ancient philosophical insights.

Write the article in Persian. Make it between 1200-1800 words. Focus on depth, originality, and intellectual richness rather than breadth.

Begin.`;
        }

        function copyPrompt() {
            const text = document.getElementById('prompt-output').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btns = document.querySelectorAll('#result button');
                if (btns.length > 0) {
                    const originalText = btns[0].innerHTML;
                    btns[0].innerHTML = '<i class="fa-solid fa-check"></i> <span>کپی شد</span>';
                    setTimeout(() => {
                        btns[0].innerHTML = originalText;
                    }, 2000);
                }
            });
        }

        function init() {
            initTailwind();
            // Optional: Auto-generate example on load for better UX
            // setTimeout(() => { document.getElementById('topic').value = "تأثیر موسیقی بر مغز انسان"; generatePrompt(); }, 1200);
        }

        window.onload = init;
    </script>
</body>
</html>
